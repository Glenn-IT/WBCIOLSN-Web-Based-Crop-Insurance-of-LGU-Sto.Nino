<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Test Panel — Crop Insurance</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
      }
      header {
        background: linear-gradient(135deg, #1e3a5f, #0f766e);
        padding: 20px 32px;
        display: flex;
        align-items: center;
        gap: 16px;
        border-bottom: 1px solid #1e293b;
      }
      header h1 {
        font-size: 22px;
        font-weight: 700;
        color: #fff;
      }
      header span {
        font-size: 12px;
        background: #ef4444;
        color: #fff;
        padding: 3px 8px;
        border-radius: 20px;
        font-weight: 600;
      }
      .layout {
        display: grid;
        grid-template-columns: 280px 1fr;
        height: calc(100vh - 64px);
      }
      .sidebar {
        background: #1e293b;
        border-right: 1px solid #334155;
        overflow-y: auto;
        padding: 16px 0;
      }
      .sidebar-section {
        padding: 8px 16px 4px;
        font-size: 10px;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 8px;
      }
      .test-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 20px;
        background: none;
        border: none;
        color: #94a3b8;
        font-size: 13px;
        cursor: pointer;
        text-align: left;
        transition: all 0.15s;
      }
      .test-btn:hover {
        background: #0f172a;
        color: #e2e8f0;
      }
      .test-btn.active {
        background: #0f172a;
        color: #38bdf8;
        border-left: 3px solid #38bdf8;
      }
      .test-btn .method {
        font-size: 10px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 4px;
        min-width: 40px;
        text-align: center;
      }
      .GET {
        background: #065f46;
        color: #6ee7b7;
      }
      .POST {
        background: #1e3a5f;
        color: #93c5fd;
      }
      .PUT {
        background: #451a03;
        color: #fdba74;
      }
      .DELETE {
        background: #450a0a;
        color: #fca5a5;
      }
      .main {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .top-bar {
        padding: 16px 24px;
        background: #1e293b;
        border-bottom: 1px solid #334155;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .top-bar input,
      .top-bar select {
        background: #0f172a;
        border: 1px solid #334155;
        color: #e2e8f0;
        padding: 7px 12px;
        border-radius: 6px;
        font-size: 13px;
        font-family: inherit;
      }
      .top-bar input {
        flex: 1;
        min-width: 200px;
        font-family: "Consolas", monospace;
      }
      .run-btn {
        padding: 8px 20px;
        background: #0ea5e9;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
        white-space: nowrap;
      }
      .run-btn:hover {
        background: #0284c7;
      }
      .run-btn:active {
        background: #0369a1;
      }
      .run-btn:disabled {
        background: #334155;
        cursor: not-allowed;
      }
      .run-all-btn {
        padding: 8px 16px;
        background: #7c3aed;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      .run-all-btn:hover {
        background: #6d28d9;
      }
      .content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        flex: 1;
        overflow: hidden;
        gap: 0;
      }
      .panel {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .panel-header {
        padding: 10px 16px;
        font-size: 11px;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 1px;
        background: #1e293b;
        border-bottom: 1px solid #334155;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .panel-header .copy-btn {
        background: none;
        border: 1px solid #334155;
        color: #94a3b8;
        padding: 3px 10px;
        border-radius: 4px;
        font-size: 11px;
        cursor: pointer;
      }
      .panel-header .copy-btn:hover {
        background: #334155;
      }
      .panel-body {
        flex: 1;
        overflow: auto;
        padding: 16px;
      }
      .border-right {
        border-right: 1px solid #334155;
      }
      pre {
        font-family: "Consolas", "Courier New", monospace;
        font-size: 12.5px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .success {
        color: #4ade80;
      }
      .error {
        color: #f87171;
      }
      .info {
        color: #94a3b8;
      }
      .status-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 700;
      }
      .s2xx {
        background: #065f46;
        color: #6ee7b7;
      }
      .s4xx {
        background: #450a0a;
        color: #fca5a5;
      }
      .s5xx {
        background: #431407;
        color: #fdba74;
      }
      .form-group {
        margin-bottom: 12px;
      }
      .form-group label {
        display: block;
        font-size: 11px;
        color: #64748b;
        margin-bottom: 4px;
        font-weight: 600;
        text-transform: uppercase;
      }
      .form-group textarea,
      .form-group input,
      .form-group select {
        width: 100%;
        background: #0f172a;
        border: 1px solid #334155;
        color: #e2e8f0;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-family: "Consolas", monospace;
      }
      .form-group textarea {
        resize: vertical;
        min-height: 120px;
      }
      .auth-box {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 12px;
      }
      .auth-box h4 {
        font-size: 12px;
        color: #64748b;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .token-display {
        font-size: 11px;
        color: #38bdf8;
        word-break: break-all;
        font-family: monospace;
      }
      .status-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .stat-chip {
        font-size: 11px;
        background: #1e293b;
        border: 1px solid #334155;
        padding: 3px 8px;
        border-radius: 4px;
        color: #94a3b8;
      }
      .suite-result {
        padding: 4px 0;
        font-size: 12px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dot-pass {
        background: #4ade80;
      }
      .dot-fail {
        background: #f87171;
      }
      .dot-run {
        background: #fbbf24;
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <header>
      <div style="font-size: 26px">🌽</div>
      <h1>API Test Panel</h1>
      <span>DEV ONLY</span>
      <div
        style="margin-left: auto; display: flex; gap: 10px; align-items: center"
      >
        <div id="token-status" style="font-size: 12px; color: #64748b">
          Not logged in
        </div>
        <button class="run-all-btn" onclick="runAllTests()">
          ▶ Run All Tests
        </button>
      </div>
    </header>

    <div class="layout">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-section">Auth</div>
        <button class="test-btn" onclick="setTest('login_farmer')">
          <span class="method POST">POST</span>/auth/login (farmer)
        </button>
        <button class="test-btn" onclick="setTest('login_admin')">
          <span class="method POST">POST</span>/auth/login (admin)
        </button>
        <button class="test-btn" onclick="setTest('auth_me')">
          <span class="method GET">GET</span>/auth/me
        </button>
        <button class="test-btn" onclick="setTest('register')">
          <span class="method POST">POST</span>/auth/register
        </button>

        <div class="sidebar-section">Plans (public)</div>
        <button class="test-btn" onclick="setTest('plans_list')">
          <span class="method GET">GET</span>/plans
        </button>
        <button class="test-btn" onclick="setTest('plans_show')">
          <span class="method GET">GET</span>/plans/1
        </button>

        <div class="sidebar-section">Farms</div>
        <button class="test-btn" onclick="setTest('farms_list')">
          <span class="method GET">GET</span>/farms
        </button>
        <button class="test-btn" onclick="setTest('farms_create')">
          <span class="method POST">POST</span>/farms
        </button>
        <button class="test-btn" onclick="setTest('farms_show')">
          <span class="method GET">GET</span>/farms/{id}
        </button>

        <div class="sidebar-section">Policies</div>
        <button class="test-btn" onclick="setTest('policies_list')">
          <span class="method GET">GET</span>/policies
        </button>
        <button class="test-btn" onclick="setTest('policies_create')">
          <span class="method POST">POST</span>/policies
        </button>
        <button class="test-btn" onclick="setTest('policies_show')">
          <span class="method GET">GET</span>/policies/{id}
        </button>

        <div class="sidebar-section">Claims</div>
        <button class="test-btn" onclick="setTest('claims_list')">
          <span class="method GET">GET</span>/claims
        </button>
        <button class="test-btn" onclick="setTest('claims_create')">
          <span class="method POST">POST</span>/claims
        </button>

        <div class="sidebar-section">Users (admin)</div>
        <button class="test-btn" onclick="setTest('users_list')">
          <span class="method GET">GET</span>/users
        </button>

        <div class="sidebar-section">Full Flow</div>
        <button class="test-btn" onclick="setTest('full_flow')">
          <span class="method POST">FLOW</span>Submit Application
        </button>

        <div style="padding: 16px">
          <div class="auth-box">
            <h4>🔑 Active Token</h4>
            <div class="token-display" id="token-box">—</div>
            <button
              style="
                margin-top: 8px;
                width: 100%;
                background: #334155;
                border: none;
                color: #94a3b8;
                padding: 6px;
                border-radius: 4px;
                font-size: 11px;
                cursor: pointer;
              "
              onclick="clearToken()"
            >
              Clear Token
            </button>
          </div>
          <div class="auth-box" style="margin-top: 0">
            <h4>📊 Test Suite Results</h4>
            <div id="suite-results" style="font-size: 12px; color: #64748b">
              Run all tests to see results.
            </div>
          </div>
        </div>
      </div>

      <!-- Main -->
      <div class="main">
        <div class="top-bar">
          <select id="method-select" style="width: 90px">
            <option>GET</option>
            <option>POST</option>
            <option>PUT</option>
            <option>DELETE</option>
          </select>
          <input
            id="url-input"
            type="text"
            value="/auth/login"
            placeholder="/endpoint"
          />
          <button class="run-btn" id="run-btn" onclick="runRequest()">
            ▶ Run
          </button>
        </div>
        <div class="content">
          <!-- Request Panel -->
          <div class="panel border-right">
            <div class="panel-header">
              📤 Request Body
              <button class="copy-btn" onclick="copyText('req-body')">
                Copy
              </button>
            </div>
            <div class="panel-body">
              <div class="form-group">
                <label>Body (JSON)</label>
                <textarea
                  id="req-body"
                  placeholder='{"key": "value"}'
                ></textarea>
              </div>
              <div class="form-group">
                <label>Auth Token (auto-filled on login)</label>
                <input
                  id="auth-token"
                  type="text"
                  placeholder="Bearer token (auto-filled)"
                />
              </div>
              <div
                id="test-description"
                style="
                  font-size: 12px;
                  color: #64748b;
                  margin-top: 8px;
                  line-height: 1.6;
                "
              ></div>
            </div>
          </div>
          <!-- Response Panel -->
          <div class="panel">
            <div class="panel-header">
              <div id="status-row" class="status-row">📥 Response</div>
              <button class="copy-btn" onclick="copyText('res-body')">
                Copy
              </button>
            </div>
            <div class="panel-body">
              <pre id="res-body" class="info">
// Select a test from the sidebar and click ▶ Run</pre
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const API_BASE = "/web-based-crop-insurance/api";
      let activeToken = localStorage.getItem("lgu_token") || "";
      let lastFarmId = null;
      let lastPolicyId = null;

      // ─── Token helpers ───────────────────────────────────────────
      function updateTokenDisplay() {
        const box = document.getElementById("token-box");
        const status = document.getElementById("token-status");
        if (activeToken) {
          box.textContent = activeToken.substring(0, 60) + "...";
          status.textContent = "🟢 Authenticated";
          status.style.color = "#4ade80";
          document.getElementById("auth-token").value = activeToken;
        } else {
          box.textContent = "—";
          status.textContent = "Not logged in";
          status.style.color = "#64748b";
        }
      }

      function clearToken() {
        activeToken = "";
        localStorage.removeItem("lgu_token");
        updateTokenDisplay();
      }

      // ─── Test definitions ───────────────────────────────────────
      const TESTS = {
        login_farmer: {
          method: "POST",
          url: "/auth/login",
          auth: false,
          body: { email: "farmer1@cropinsurance.ph", password: "Password@123" },
          desc: "Login as a farmer. Token will be saved automatically.",
          expect: 200,
        },
        login_admin: {
          method: "POST",
          url: "/auth/login",
          auth: false,
          body: { email: "admin@cropinsurance.ph", password: "Password@123" },
          desc: "Login as admin. Token will be saved automatically.",
          expect: 200,
        },
        auth_me: {
          method: "GET",
          url: "/auth/me",
          auth: true,
          body: null,
          desc: "Get the currently authenticated user profile.",
          expect: 200,
        },
        register: {
          method: "POST",
          url: "/auth/register",
          auth: false,
          body: {
            first_name: "Test",
            last_name: "User",
            email: "testuser" + Date.now() + "@test.ph",
            password: "Password@123",
            phone: "09100000000",
          },
          desc: "Register a new farmer account.",
          expect: 201,
        },
        plans_list: {
          method: "GET",
          url: "/plans",
          auth: false,
          body: null,
          desc: "Get all active coverage plans. This is public — no token needed.",
          expect: 200,
        },
        plans_show: {
          method: "GET",
          url: "/plans/1",
          auth: false,
          body: null,
          desc: "Get a single coverage plan by ID.",
          expect: 200,
        },
        farms_list: {
          method: "GET",
          url: "/farms",
          auth: true,
          body: null,
          desc: "Get all farms belonging to the logged-in farmer.",
          expect: 200,
        },
        farms_create: {
          method: "POST",
          url: "/farms",
          auth: true,
          body: {
            farm_name: "Pedro Dela Cruz Farm",
            location: "Brgy. Maligaya, Sto. Nino",
            area_hectares: 2.5,
            crop_type_id: 1,
            soil_type: "Irrigated",
            irrigation: 1,
          },
          desc: "Create a new farm record. Requires authentication. Tests the apostrophe/SQL-injection fix.",
          expect: 201,
        },
        farms_show: {
          method: "GET",
          url: () => "/farms/" + (lastFarmId || 1),
          auth: true,
          body: null,
          desc: "Get a single farm by ID (uses last created farm ID, or 1).",
          expect: 200,
        },
        policies_list: {
          method: "GET",
          url: "/policies",
          auth: true,
          body: null,
          desc: "Get all policies for the logged-in user.",
          expect: 200,
        },
        policies_create: {
          method: "POST",
          url: "/policies",
          auth: true,
          body: () => ({
            farm_id: lastFarmId || 1,
            plan_id: 1,
            start_date: new Date().toISOString().split("T")[0],
          }),
          desc: "Create a new policy application. Requires a valid farm_id and plan_id.",
          expect: 201,
        },
        policies_show: {
          method: "GET",
          url: () => "/policies/" + (lastPolicyId || 1),
          auth: true,
          body: null,
          desc: "Get a single policy by ID.",
          expect: 200,
        },
        claims_list: {
          method: "GET",
          url: "/claims",
          auth: true,
          body: null,
          desc: "Get all claims for the logged-in user.",
          expect: 200,
        },
        claims_create: {
          method: "POST",
          url: "/claims",
          auth: true,
          body: () => ({
            policy_id: lastPolicyId || 1,
            incident_type: "Flood",
            incident_date: "2026-04-01",
            description: "Severe flooding damaged crops.",
            estimated_loss: 25000,
          }),
          desc: "File a new insurance claim.",
          expect: 201,
        },
        users_list: {
          method: "GET",
          url: "/users",
          auth: true,
          body: null,
          desc: "List all users (admin only). Login as admin first.",
          expect: 200,
        },
      };

      // ─── Set test ────────────────────────────────────────────────
      function setTest(key) {
        document
          .querySelectorAll(".test-btn")
          .forEach((b) => b.classList.remove("active"));
        event.currentTarget.classList.add("active");

        if (key === "full_flow") {
          document.getElementById("req-body").value =
            '// Full Application Flow:\n// 1. POST /auth/login\n// 2. POST /farms\n// 3. GET  /plans\n// 4. POST /policies\n//\n// Click "▶ Run All Tests" or run each step manually.';
          document.getElementById("url-input").value = "(Full Flow)";
          document.getElementById("method-select").value = "POST";
          document.getElementById("test-description").textContent =
            'Runs the full new-application flow: login → create farm → get plans → create policy. Click "Run All Tests" in the header.';
          return;
        }

        const t = TESTS[key];
        if (!t) return;

        document.getElementById("method-select").value = t.method;
        document.getElementById("url-input").value =
          typeof t.url === "function" ? t.url() : t.url;
        document.getElementById("req-body").value = t.body
          ? JSON.stringify(
              typeof t.body === "function" ? t.body() : t.body,
              null,
              2,
            )
          : "";
        document.getElementById("auth-token").value = t.auth ? activeToken : "";
        document.getElementById("test-description").textContent = t.desc || "";
      }

      // ─── Run request ─────────────────────────────────────────────
      async function runRequest() {
        const btn = document.getElementById("run-btn");
        const resEl = document.getElementById("res-body");
        const statEl = document.getElementById("status-row");

        const method = document.getElementById("method-select").value;
        const url = document.getElementById("url-input").value;
        const bodyStr = document.getElementById("req-body").value.trim();
        const token =
          document.getElementById("auth-token").value.trim() || activeToken;

        btn.disabled = true;
        btn.textContent = "⏳";
        resEl.textContent = "// Sending request...";
        resEl.className = "info";

        const headers = { "Content-Type": "application/json" };
        if (token) headers["Authorization"] = "Bearer " + token;

        const opts = { method, headers };
        if (bodyStr && method !== "GET") {
          try {
            opts.body = bodyStr;
            JSON.parse(bodyStr);
          } catch (e) {
            resEl.textContent =
              "// ❌ Invalid JSON in request body:\n// " + e.message;
            resEl.className = "error";
            btn.disabled = false;
            btn.textContent = "▶ Run";
            return;
          }
        }

        const start = Date.now();
        try {
          const res = await fetch(API_BASE + url, opts);
          const ms = Date.now() - start;
          const json = await res.json().catch(() => null);
          const txt = JSON.stringify(json, null, 2);

          const cls =
            res.status < 300 ? "s2xx" : res.status < 500 ? "s4xx" : "s5xx";
          statEl.innerHTML = `📥 Response &nbsp;<span class="status-badge ${cls}">${res.status}</span>&nbsp;<span class="stat-chip">${ms}ms</span>`;

          resEl.textContent = txt || "(empty)";
          resEl.className = res.ok ? "success" : "error";

          // Auto-save token on login
          if (res.ok && json?.data?.token) {
            activeToken = json.data.token;
            localStorage.setItem("lgu_token", activeToken);
            updateTokenDisplay();
          }
          // Save farm/policy IDs from create responses
          if (res.ok && json?.data?.id) {
            if (url.includes("/farms") && method === "POST")
              lastFarmId = json.data.id;
            if (url.includes("/policies") && method === "POST")
              lastPolicyId = json.data.id;
          }
        } catch (err) {
          resEl.textContent = "// ❌ Network error:\n// " + err.message;
          resEl.className = "error";
          statEl.innerHTML =
            '📥 Response &nbsp;<span class="status-badge s5xx">ERR</span>';
        }

        btn.disabled = false;
        btn.textContent = "▶ Run";
      }

      // ─── Run all tests (ordered flow) ───────────────────────────
      async function runAllTests() {
        const order = [
          "login_farmer",
          "plans_list",
          "farms_create",
          "farms_show",
          "policies_create",
          "policies_show",
          "claims_list",
          "auth_me",
        ];
        const resultEl = document.getElementById("suite-results");
        resultEl.innerHTML =
          '<div style="color:#fbbf24;font-size:12px;">⏳ Running tests...</div>';

        let passed = 0,
          failed = 0;
        const rows = [];

        for (const key of order) {
          const t = TESTS[key];
          if (!t) continue;

          // Update running indicator
          rows.push({
            key,
            label: `${t.method} ${typeof t.url === "function" ? t.url() : t.url}`,
            status: "run",
          });
          renderSuite(rows);

          const url = typeof t.url === "function" ? t.url() : t.url;
          const body = typeof t.body === "function" ? t.body() : t.body;
          const token = t.auth ? activeToken : null;
          const headers = { "Content-Type": "application/json" };
          if (token) headers["Authorization"] = "Bearer " + token;
          const opts = { method: t.method, headers };
          if (body && t.method !== "GET") opts.body = JSON.stringify(body);

          try {
            const res = await fetch(API_BASE + url, opts);
            const json = await res.json().catch(() => null);
            const ok =
              res.status === t.expect ||
              (t.expect === 200 && res.status === 201);

            // Save token & IDs
            if (res.ok && json?.data?.token) {
              activeToken = json.data.token;
              localStorage.setItem("lgu_token", activeToken);
              updateTokenDisplay();
            }
            if (res.ok && json?.data?.id) {
              if (url.includes("/farms") && t.method === "POST")
                lastFarmId = json.data.id;
              if (url.includes("/policies") && t.method === "POST")
                lastPolicyId = json.data.id;
            }

            rows[rows.length - 1].status = ok ? "pass" : "fail";
            rows[rows.length - 1].detail =
              `${res.status} — ${json?.message || ""}`;
            ok ? passed++ : failed++;
          } catch (e) {
            rows[rows.length - 1].status = "fail";
            rows[rows.length - 1].detail = "Network error: " + e.message;
            failed++;
          }

          renderSuite(rows);
          await new Promise((r) => setTimeout(r, 300));
        }

        // Summary
        const summaryEl = document.createElement("div");
        summaryEl.style.cssText =
          "margin-top:10px;padding:8px;background:#0f172a;border-radius:6px;font-size:12px;";
        summaryEl.innerHTML = `<span style="color:#4ade80;">✓ ${passed} passed</span>  <span style="color:#f87171;">✗ ${failed} failed</span>`;
        resultEl.appendChild(summaryEl);
      }

      function renderSuite(rows) {
        const el = document.getElementById("suite-results");
        el.innerHTML = rows
          .map((r) => {
            const dotClass =
              r.status === "pass"
                ? "dot-pass"
                : r.status === "fail"
                  ? "dot-fail"
                  : "dot-run";
            const detail = r.detail
              ? `<span style="color:#64748b;"> — ${r.detail}</span>`
              : "";
            return `<div class="suite-result"><span class="dot ${dotClass}"></span><span style="color:#e2e8f0;">${r.label}</span>${detail}</div>`;
          })
          .join("");
      }

      // ─── Copy helper ─────────────────────────────────────────────
      function copyText(id) {
        navigator.clipboard
          .writeText(document.getElementById(id).textContent)
          .then(() => {
            const btn = event.currentTarget;
            btn.textContent = "Copied!";
            setTimeout(() => (btn.textContent = "Copy"), 1500);
          });
      }

      // ─── Init ─────────────────────────────────────────────────────
      updateTokenDisplay();
      setTest("login_farmer");
    </script>
  </body>
</html>
